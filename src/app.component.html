<div class="flex h-screen w-full bg-gray-900">
  <!-- Sidebar Navigation -->
  <aside class="w-20 lg:w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0 transition-all duration-300">
    <!-- Logo Area -->
    <div class="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-gray-800">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shrink-0 shadow-lg shadow-cyan-500/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </div>
      <h1 class="hidden lg:block ml-3 font-bold text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">Future<span class="text-cyan-400">World</span></h1>
    </div>

    <!-- Nav Items -->
    <nav class="flex-1 py-6 flex flex-col gap-2 px-3">
      <button 
        (click)="activeTab.set('pos')"
        class="flex items-center gap-3 px-3 py-3 rounded-xl transition-all duration-200 group"
        [class]="activeTab() === 'pos' ? 'bg-cyan-500/10 text-cyan-400' : 'text-gray-400 hover:bg-gray-800 hover:text-white'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <span class="hidden lg:block font-medium">အရောင်း (POS)</span>
        
        @if (activeTab() === 'pos') {
             <div class="hidden lg:block ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
        }
      </button>

      <button 
        (click)="activeTab.set('dashboard')"
        class="flex items-center gap-3 px-3 py-3 rounded-xl transition-all duration-200 group"
        [class]="activeTab() === 'dashboard' ? 'bg-cyan-500/10 text-cyan-400' : 'text-gray-400 hover:bg-gray-800 hover:text-white'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
        <span class="hidden lg:block font-medium">အစီရင်ခံစာ (Dashboard)</span>
         @if (activeTab() === 'dashboard') {
             <div class="hidden lg:block ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
        }
      </button>
    </nav>

    <!-- User Profile (Bottom) -->
    <div class="p-4 border-t border-gray-800">
      <div class="flex items-center gap-3 p-2 rounded-xl bg-gray-800/50 border border-gray-700">
        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-pink-500"></div>
        <div class="hidden lg:block overflow-hidden">
          <p class="text-sm font-bold text-white truncate">ဆိုင်ရှင်</p>
          <p class="text-xs text-green-400">Online</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 h-full overflow-hidden bg-gray-900 relative">
     <!-- Background decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/5 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-cyan-600/5 rounded-full blur-[100px]"></div>
    </div>

    <!-- Content Area (Z-Index to sit above background) -->
    <div class="relative z-10 h-full">
        @if (activeTab() === 'pos') {
            <app-pos-terminal></app-pos-terminal>
        } @else {
            <app-dashboard></app-dashboard>
        }
    </div>
  </main>
</div>
